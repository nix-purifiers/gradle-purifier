// Host-local diagnostics only. Never select, pin, or admit a project JVM.
def destination = System.getenv('GRADLE_PURIFIER_RUNTIME_DIAGNOSTICS') ?:
    System.getProperty('gradle.purifier.runtime.diagnostics')
if (!destination) return
try {
    def target = new File(destination)
    target.parentFile.mkdirs()
    def observed = new Properties()
    ['java.home', 'java.version', 'java.runtime.version', 'java.vendor',
     'java.vm.name', 'java.vm.version', 'os.name', 'os.arch'].each { key ->
        def value = System.getProperty(key)
        if (value != null) observed.setProperty(key, value)
    }
    def temporary = File.createTempFile('.native-runtime-', '.properties', target.parentFile)
    temporary.withOutputStream { output ->
        observed.store(output, 'Host-local runtime diagnostics; not dependency-lock admission data')
    }
    if (!temporary.renameTo(target)) temporary.delete()
} catch (Exception error) {
    logger.debug('gradle-purifier: could not retain optional native runtime diagnostics', error)
}
