// Selected SDK roles are stable lock inputs. Runtime task outcomes stay diagnostic.
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.testing.Test
import org.gradle.api.tasks.JavaExec
import org.gradle.api.tasks.javadoc.Javadoc

def mode = System.getenv('GRADLE_PURIFIER_MODE') ?: System.getProperty('gradle.purifier.mode')
if (!mode) return
def legacy56 = gradle.gradleVersion == '5.6.4'
def contextPath = System.getenv('GRADLE_PURIFIER_JDK_CONTEXT') ?: System.getProperty('gradle.purifier.jdk.context')
def expected = contextPath ? new JsonSlurper().parse(new File(contextPath)) : null
if (expected) {
    gradle.startParameter.projectProperties = gradle.startParameter.projectProperties + [
        'org.gradle.java.installations.auto-detect': 'false',
        'org.gradle.java.installations.auto-download': 'false',
        'org.gradle.java.installations.paths': expected.paths.join(',')]
}
def isRootSdkBuild = {
    def explicit = System.getenv('GRADLE_PURIFIER_BUILD_ROOT') ?: System.getProperty('gradle.purifier.sdk.root')
    def outermost = gradle
    while (outermost.parent != null) outermost = outermost.parent
    def root = explicit ? new File(explicit) : outermost.startParameter.currentDir
    root.canonicalPath == gradle.rootProject.projectDir.canonicalPath
}
def rows = []
def observations = Collections.synchronizedMap([:])
def captureOutput = System.getenv('GRADLE_PURIFIER_OUTPUT')
def roleOf = { task ->
    // A disabled old Test task establishes no runtime selection or execution.
    if (legacy56 && task instanceof Test && !task.enabled) return null
    task instanceof JavaCompile ? 'compiler' : task instanceof Javadoc ? 'javadoc' :
        (task instanceof Test || task instanceof JavaExec) ? 'launcher' : null
}
// Read the effective runtime through the same public fork-options copy API
// native Test execution uses. The target records only the executable; it
// discards environment/working-directory values and never sets task defaults.
def validateNativeTestExecutable = { values ->
    def candidates = values.findAll { it != null }.unique()
    if (candidates.size() != 1 || values.isEmpty() || values[-1] != candidates[0]) {
        throw new GradleException('gradle-purifier: native Test effective executable is absent or ambiguous')
    }
    def executable = new File(candidates[0])
    if (!executable.isAbsolute() || executable.name != 'java' || executable.parentFile?.name != 'bin') {
        throw new GradleException('gradle-purifier: malformed native Test effective executable')
    }
    executable
}
def nativeForkOptionsTarget = { forkInterface, values ->
    def operations = 0
    def handler = { proxy, method, arguments ->
        if (++operations > 16) throw new GradleException('gradle-purifier: unsupported native Test fork-options copy operations')
        if (method.declaringClass == Object) {
            if (method.name == 'toString') return 'PurifierForkOptionsTarget'
            if (method.name == 'hashCode') return System.identityHashCode(proxy)
            if (method.name == 'equals') return proxy.is(arguments[0])
        }
        if (method.name == 'setExecutable' && arguments?.length == 1) {
            def value = arguments[0]
            if (value != null && (!(value instanceof String) || value.isEmpty() || value.length() > 4096)) {
                throw new GradleException('gradle-purifier: malformed native Test effective executable')
            }
            values << value
            return null
        }
        if (method.name in ['setWorkingDir', 'setEnvironment'] && arguments?.length == 1) return null
        throw new GradleException('gradle-purifier: unsupported native Test fork-options copy operation')
    } as java.lang.reflect.InvocationHandler
    java.lang.reflect.Proxy.newProxyInstance(forkInterface.classLoader, [forkInterface] as Class[], handler)
}
def nativeTestExecutable = { task ->
    def forkInterface
    try { forkInterface = Class.forName('org.gradle.process.ProcessForkOptions', false, task.getClass().classLoader) }
    catch (ClassNotFoundException absent) { throw new GradleException('gradle-purifier: native Test fork-options API is unavailable', absent) }
    if (!task.getClass().methods.any { it.name == 'copyTo' && it.parameterTypes.toList() == [forkInterface] }) {
        throw new GradleException('gradle-purifier: native Test fork-options copy API is unavailable')
    }
    // The two native overloads share the effective-runtime calculation.
    // An override could report a different SDK than execution actually uses.
    def copyMethods = task.getClass().methods.findAll {
        it.name == 'copyTo' && it.parameterTypes.length == 1 &&
        it.parameterTypes[0].name in ['org.gradle.process.ProcessForkOptions', 'org.gradle.process.JavaForkOptions']
    }
    if (copyMethods.any { it.declaringClass != Test } ||
        !copyMethods.any { it.parameterTypes[0].name == 'org.gradle.process.JavaForkOptions' }) {
        throw new GradleException('gradle-purifier: unsupported native Test fork-options implementation')
    }
    def type = task.getClass()
    while (type != null && type != Test) {
        if (type.declaredMethods.any { it.name == 'createTestExecutionSpec' }) {
            throw new GradleException('gradle-purifier: unsupported native Test execution-spec implementation')
        }
        type = type.superclass
    }
    def before = legacy56 ? [task.executable] : [task.javaLauncher.present, task.executable]
    def values = []
    def target = nativeForkOptionsTarget(forkInterface, values)
    task.copyTo(target)
    if ((legacy56 ? [task.executable] : [task.javaLauncher.present, task.executable]) != before) {
        throw new GradleException('gradle-purifier: native Test fork-options copy changed task SDK configuration')
    }
    validateNativeTestExecutable(values)
}
def sameSelection = { selected, current ->
    selected != null && current != null &&
        ['home', 'canonicalHome', 'executable', 'canonicalExecutable'].every { selected[it] == current[it] } &&
        (selected.selectionProvenance ?: 'resolved-selected-provider') == (current.selectionProvenance ?: 'resolved-selected-provider')
}
def inspectSelection = { task ->
    def role = roleOf(task)
    if (!role) return null
    if (legacy56 && task instanceof JavaCompile) {
        if (!task.options.fork || !(task.options.forkOptions.executable || task.options.forkOptions.javaHome))
            throw new GradleException('gradle-purifier: Gradle5.6.4 compiler requires an explicit forked immutable SDK')
        if (task.options.forkOptions.executable && task.options.forkOptions.javaHome &&
            new File(task.options.forkOptions.executable).canonicalFile.parentFile.parentFile != task.options.forkOptions.javaHome.canonicalFile)
            throw new GradleException('gradle-purifier: Gradle5.6.4 compiler executable and javaHome select conflicting SDKs')
    }
    def providerName = role == 'compiler' ? 'javaCompiler' : role == 'javadoc' ? 'javadocTool' : 'javaLauncher'
    if (mode != 'lock' && !expected && task instanceof JavaCompile && task.options.fork && task.options.forkOptions.executable) {
        def requestedHome = new File(task.options.forkOptions.executable).absoluteFile.parentFile.parentFile
        if (requestedHome.absolutePath != new File(System.getProperty('java.home')).canonicalPath) {
            throw new GradleException("gradle-purifier: ${task.path} selects a non-manager SDK absent from this lock; run 'gradle-purifier lock --relock -- ${task.path}'")
        }
    }
    def explicit = null
    if (task instanceof JavaCompile && task.options.fork) {
        if (task.options.forkOptions.executable) explicit = new File(task.options.forkOptions.executable)
        else if (task.options.forkOptions.javaHome) explicit = new File(task.options.forkOptions.javaHome, 'bin/javac')
    } else if ((task instanceof Test || task instanceof JavaExec) && task.executable) {
        explicit = new File(task.executable)
    }
    if (legacy56 && task instanceof Javadoc && task.executable) explicit = new File(task.executable)
    def provider = legacy56 && !task.hasProperty(providerName) ? null : task.property(providerName)
    def tool = provider != null && provider.present ? provider.get() : null
    def nativeRuntime = tool == null && task instanceof Test && (explicit == null || legacy56)
    if (tool == null && explicit == null && !nativeRuntime) {
        throw new GradleException("gradle-purifier: ${task.path} has no selected SDK; run 'gradle-purifier lock --relock -- ${task.path}'")
    }
    def executable = nativeRuntime ? nativeTestExecutable(task) : (explicit ?: tool.executablePath.asFile)
    // Preserve existing provider-based Javadoc selection; no absent-provider
    // Javadoc fallback is introduced by the executable adapter.
    if (task instanceof Javadoc && task.executable) executable = new File(task.executable)
    def home = executable.absoluteFile.parentFile.parentFile
    if (explicit != null && role in ['compiler', 'launcher']) {
        def binary = role == 'compiler' ? 'javac' : 'java'
        if (explicit.absolutePath != new File(home, 'bin/' + binary).absolutePath) {
            throw new GradleException("gradle-purifier: ${task.path} explicit executable does not match its ${role} SDK role")
        }
    }
    if (tool != null && explicit != null && home.canonicalPath != tool.metadata.installationPath.asFile.canonicalPath) {
        throw new GradleException("gradle-purifier: ${task.path} selects conflicting provider and explicit SDKs; select one immutable SDK and relock")
    }
    // Retain lexical paths too: canonicalizing an ambient alias must not bless it.
    def row = [task: task.path, role: role, home: home.absolutePath, canonicalHome: home.canonicalPath,
        executable: executable.absolutePath, canonicalExecutable: executable.canonicalPath]
    if (tool != null) {
        row.providerHome = tool.metadata.installationPath.asFile.absolutePath
        row.providerMajor = tool.metadata.languageVersion.toString()
    } else {
        row.selectionProvenance = legacy56 && task instanceof Javadoc ? 'gradle-5.6.4-configured-javadoc-executable-v1' :
            (nativeRuntime ? 'native-effective-fork-options' : 'configured-native-executable')
    }
    row
}
def select = { task ->
    try { inspectSelection(task) }
    catch (Exception error) {
        throw new GradleException("gradle-purifier: cannot resolve SDK role for ${task.path}; run 'gradle-purifier lock --relock -- ${task.path}'", error)
    }
}
def check = { row ->
    if (!expected || expected.legacy) {
        def allowed = [new File(System.getProperty('java.home')).canonicalPath] + (expected?.explicitHomes ?: [])
        if (row.home != row.canonicalHome || !allowed.contains(row.home) || row.executable != row.canonicalExecutable) {
            throw new GradleException("gradle-purifier: ${row.task} selects a non-manager SDK absent from this lock; run 'gradle-purifier lock --relock -- ${row.task}'")
        }
        return
    }
    def matches = expected.roles.findAll { it.task == row.task && it.role == row.role }
    if (matches.size() > 1) throw new GradleException("gradle-purifier: ambiguous SDK task role ${row.task}/${row.role}; run 'gradle-purifier lock --relock -- ${row.task}'")
    def recorded = matches ? matches[0] : null
    if (!recorded) throw new GradleException("gradle-purifier: SDK role ${row.task}/${row.role} was not selected by the lock; run 'gradle-purifier lock --relock -- ${row.task}'")
    if ((row.selectionProvenance ?: 'resolved-selected-provider') != recorded.provenance) {
        throw new GradleException("gradle-purifier: ${row.task} changed its SDK selection provenance; run 'gradle-purifier lock --relock'")
    }
    if (row.home != row.canonicalHome || row.home != recorded.home || row.executable != row.canonicalExecutable) {
        throw new GradleException("gradle-purifier: ${row.task} selected an SDK that differs from its immutable lock; select the recorded Nix SDK and run 'gradle-purifier lock --relock -- ${row.task}'")
    }
    if (System.getenv('GRADLE_PURIFIER_SDK_TRACE') == '1') {
        println "GRADLE-SDK-VALIDATED ${row.task}/${row.role} ${row.home}"
    }
}
gradle.taskGraph.whenReady { graph ->
    graph.allTasks.each { task ->
        def row = select(task)
        if (row) {
            if (!isRootSdkBuild()) {
                def managerHome = expected?.managerHome ?: new File(System.getProperty('java.home')).canonicalPath
                def allowed = [managerHome] + ((expected?.legacy) ? expected.explicitHomes : [])
                if (row.home != row.canonicalHome || !allowed.contains(row.home)) throw new GradleException('gradle-purifier: non-manager SDK tasks in nested builds require explicit supported SDK input handling; automatic capture currently covers root-build roles')
                return
            }
            if (mode == 'lock') rows << row
            else check(row)
        }
    }
    if (mode == 'lock' && isRootSdkBuild()) {
        def directory = new File(captureOutput)
        directory.mkdirs()
        def receipt = [managerHome: new File(System.getProperty('java.home')).canonicalPath, tasks: rows.sort { a,b -> a.task <=> b.task ?: a.role <=> b.role }]
        if (legacy56) receipt.gradleVersion = gradle.gradleVersion
        new File(directory, 'task-sdks.json').text = JsonOutput.toJson(receipt)
    }
}
gradle.taskGraph.beforeTask { task ->
    if (roleOf(task) && isRootSdkBuild()) {
        def current = select(task)
        if (mode != 'lock') check(current)
        else if (!sameSelection(rows.find { it.task == task.path && it.role == current.role }, current)) {
            throw new GradleException("gradle-purifier: ${task.path} changed its SDK after graph selection; configure a stable canonical Nix SDK and relock")
        }
    }
}
gradle.taskGraph.afterTask { task, state ->
    if (roleOf(task) && isRootSdkBuild()) {
        def completed = select(task)
        if (mode != 'lock') check(completed)
        else {
            def selected = rows.find { it.task == task.path && it.role == completed.role }
            if (!sameSelection(selected, completed)) {
                throw new GradleException("gradle-purifier: ${task.path} changed its SDK during execution; configure a stable canonical Nix SDK and run 'gradle-purifier lock --relock -- ${task.path}'")
            }
            synchronized (observations) {
                observations[task.path] = [executed: state.executed, skipped: state.skipped,
                    upToDate: state.upToDate, noSource: state.noSource, failed: state.failure != null]
                new File(captureOutput, 'task-sdk-observations.json').text = JsonOutput.toJson(observations)
            }
        }
    }
}
