        'organization','licenses','developers','contributors','mailingLists','scm','issueManagement','ciManagement','properties','dependencies','prerequisites'] as Set
    if (xml.children().any { !(it.name() in allowed) } || (xml.packaging.text() ?: 'jar') != 'jar') return null
    def dependencies = []
    for (dependency in xml.dependencies.dependency) {
        if (dependency.children().any { !(it.name() in ['groupId','artifactId','version','scope','type','classifier','optional','exclusions']) }) return null
        def row = [:]
        for (key in ['groupId','artifactId','version','scope','type','classifier','optional']) {
            def values = dependency.children().findAll { it.name() == key }
            if (values.size() > 1) return null
            def value = values.size() == 0 ? '' : values[0].text().trim()
            if (value.contains('${') || value.contains('@{')) return null
            row[key] = value ?: (key == 'scope' ? 'compile' : key == 'type' ? 'jar' : key == 'optional' ? 'false' : '')
        }
        if (!row.groupId || !row.artifactId || !row.version || !(row.optional in ['true','false'])) return null
        if (dependency.exclusions.size() > 1 || dependency.exclusions.children().any { it.name() != 'exclusion' }) return null
        def exclusions = []
        for (exclusion in dependency.exclusions.exclusion) {
            if (exclusion.children()*.name().sort() != ['artifactId','groupId']) return null
            def values = [groupId:exclusion.groupId.text().trim(),artifactId:exclusion.artifactId.text().trim()]
            if (values.values().any { !it || it.contains('${') || it.contains('@{') }) return null
            exclusions << values
        }
        row.exclusions = exclusions.sort { JsonOutput.toJson(it) }
        dependencies << row
    }
    [group:xml.groupId.text(),name:xml.artifactId.text(),version:xml.version.text(),dependencies:dependencies.sort { JsonOutput.toJson(it) }]
