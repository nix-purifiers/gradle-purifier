        def attributes = usage.attributes.keySet().collectEntries { key -> [(key.name): usage.attributes.getAttribute(key).toString()] }
        if (attributes.keySet() != (['org.gradle.category','org.gradle.dependency.bundling','org.gradle.jvm.version','org.gradle.libraryelements','org.gradle.usage'] as Set) ||
            attributes['org.gradle.category'] != 'library' || attributes['org.gradle.dependency.bundling'] != 'external' ||
            attributes['org.gradle.libraryelements'] != 'jar' || !(attributes['org.gradle.jvm.version'] ==~ /[1-9][0-9]*/) ||
            attributes['org.gradle.usage'] != (usage.name == 'apiElements' ? 'java-api' : 'java-runtime')) return null
        def files = usage.artifacts.toList()
        if (files.size() != 1 || files[0].file.canonicalFile != artifact.file.canonicalFile ||
            files[0].type != 'jar' || files[0].extension != 'jar' || files[0].classifier) return null
        if (!usage.dependencyConstraints.isEmpty() || !usage.capabilities.isEmpty() || !usage.globalExcludes.isEmpty()) return null
        def dependencies = []
        for (dependency in usage.dependencies) {
            if (!(dependency instanceof org.gradle.api.artifacts.ExternalModuleDependency) || !dependency.version ||
                dependency.force || dependency.changing || dependency.targetConfiguration || dependency.endorsingStrictVersions ||
                !dependency.attributes.keySet().isEmpty() || !dependency.requestedCapabilities.isEmpty() || dependency.versionConstraint.branch ||
                dependency.versionConstraint.requiredVersion != dependency.version || dependency.versionConstraint.strictVersion || dependency.versionConstraint.preferredVersion ||
                !dependency.versionConstraint.rejectedVersions.isEmpty()) return null
            dependencies << [type:dependency.getClass().name,group:dependency.group,name:dependency.name,version:dependency.version,
                transitive:dependency.transitive,artifacts:dependency.artifacts.collect { [name:it.name,type:it.type,extension:it.extension,classifier:it.classifier] },
                exclusions:dependency.excludeRules.collect { [group:it.group,module:it.module] }.sort { JsonOutput.toJson(it) }]
        }
