// SPDX-License-Identifier: MIT
//
// The init script of gradle-purifier. The gradle-purifier command and the
// Nix builder (build-gradle-project.nix) pass it to Gradle with
// --init-script, and environment variables select what it does:
//
//   GRADLE_PURIFIER_MODE        lock, sandbox, interactive or publish;
//                               without it the script does nothing
//   GRADLE_PURIFIER_REPOSITORY  the base URL that stands in for every
//                               remote repository: the recorder's
//                               http://127.0.0.1:<port> in a lock run, and
//                               a file: URL of the tree of locked downloads
//                               otherwise
//   GRADLE_PURIFIER_OUTPUT      the directory the lock and sandbox modes
//                               write to
//   GRADLE_PURIFIER_CHECK       "1" makes purifierBuild run `check` too
//   GRADLE_PURIFIER_ARTIFACTS   in publish mode, a JSON object from project
//                               id to the Maven output of its Nix package
//   GRADLE_PURIFIER_KONAN_PROPERTIES
//                               konan.properties settings that every
//                               Kotlin/Native link overrides, such as the
//                               dynamic linker of the programs it links
//   GRADLE_PURIFIER_KONAN_DATA_DIR
//                               the Kotlin/Native data directory, whose
//                               dependencies hold the locked toolchain; it
//                               becomes the konan.data.dir property of
//                               every project, which the Kotlin plugin
//                               reads in place of KONAN_DATA_DIR
//
// A remote repository at https://host/path is read from
// <base>/https/host/path. The recorder fetches each such URL from its
// remote and records it, and the tree of locked downloads holds each file
// at the same path, so the lock run and the builds from the lockfile
// resolve through the same URLs.
//
// Gradle applies an init script to every build of a composite, buildSrc
// and included builds as well as the root build, so every build resolves
// through the stand-in. The purifier tasks belong to the root build only.

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.gradle.api.artifacts.component.ModuleComponentSelector
import org.gradle.api.artifacts.repositories.MavenArtifactRepository
import org.gradle.api.artifacts.repositories.IvyArtifactRepository
import org.gradle.api.publish.maven.MavenPublication
import org.gradle.api.publish.tasks.GenerateModuleMetadata
import org.gradle.api.publish.maven.tasks.GenerateMavenPom
import org.gradle.api.publish.maven.tasks.PublishToMavenRepository
import org.gradle.api.tasks.Sync

// A setting comes from the environment, or else from the system property
// of the same name in lower case with dots (gradle.purifier.mode), which
// the everyday init script (user.init.gradle) sets.
def setting = { String name ->
    System.getenv(name) ?: System.getProperty(name.toLowerCase().replace('_', '.'))
}

def mode = setting('GRADLE_PURIFIER_MODE')
if (mode == null || mode.isEmpty()) {
    return
}
if (!(mode in ['lock', 'sandbox', 'interactive', 'publish'])) {
    throw new GradleException("gradle-purifier: GRADLE_PURIFIER_MODE is '${mode}'; it must be lock, sandbox, interactive or publish")
}

def legacy56 = gradle.gradleVersion == '5.6.4'
if (legacy56) apply from: new File(buildscript.sourceFile.parentFile, 'legacy-settings-5.6.init.gradle')
def urlRepositoryType = legacy56 ? null : Class.forName('org.gradle.api.artifacts.repositories.UrlArtifactRepository', false, getClass().classLoader)

// A package build gives the same files each time: archives hold their
// entries in a fixed order and without the times of the files, which
// Gradle 9 does by default and Gradle 8 does not.
if (mode == 'sandbox') {
    gradle.allprojects { p ->
        p.tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach { task ->
            task.preserveFileTimestamps = false
            task.reproducibleFileOrder = true
        }
    }
}

if (mode == 'interactive' && gradle.parent == null) {
    def hasFlow = true
    for (name in ['org.gradle.api.flow.FlowAction', 'org.gradle.api.flow.FlowParameters',
                  'org.gradle.api.flow.FlowProviders', 'org.gradle.api.flow.FlowScope',
                  'org.gradle.api.provider.Property']) {
        try {
            Class.forName(name, false, getClass().classLoader)
        } catch (ClassNotFoundException absent) {
            hasFlow = false
        }
    }
    // Resolve beside the immutable common init script, including when it
    // was applied from the interactive user init script.
    def companion = hasFlow ? 'missing-hint-flow.init.gradle' : 'missing-hint-legacy.init.gradle'
    apply from: new File(buildscript.sourceFile.parentFile, companion)
}
def base = setting('GRADLE_PURIFIER_REPOSITORY')
if (base == null || base.isEmpty()) {
    throw new GradleException('gradle-purifier: GRADLE_PURIFIER_MODE is set but GRADLE_PURIFIER_REPOSITORY is not')
}
def output = System.getenv('GRADLE_PURIFIER_OUTPUT')
def konanProperties = setting('GRADLE_PURIFIER_KONAN_PROPERTIES')
def konanDataDir = setting('GRADLE_PURIFIER_KONAN_DATA_DIR')
def runCheck = System.getenv('GRADLE_PURIFIER_CHECK') == '1'
def rootBuild = gradle.parent == null
def purifierScriptDirectory = buildscript.sourceFile.parentFile
// A reserved native metadata publication is an implementation input, not a
// second user publication. Ownership is by exact object, including callbacks
// which run synchronously inside the native publication factory.
def internalLegacyPublication = { project, publication ->
    gradle.ext.has('purifierLegacyMaven') &&
        gradle.ext.purifierLegacyMaven.ownsPublication != null &&
        gradle.ext.purifierLegacyMaven.ownsPublication(project, publication)
}

// Documentation links are native Javadoc inputs, not Maven dependencies.
// Preserve the public link URL while replaying only its locked link metadata.
class PurifierJavadocMetadata {
    static URI remote(String value) {
        URI uri
        try { uri = URI.create(value) }
        catch (IllegalArgumentException error) {
            throw new GradleException('gradle-purifier: unsupported Javadoc link URL; use a credential-free HTTP(S) directory URL with a DNS name or IPv4 host (IPv6 is not supported)', error)
        }
        def authority = uri.port == -1 ? uri.host : "${uri.host}:${uri.port}"
        if (!(uri.scheme?.toLowerCase(Locale.ROOT) in ['http', 'https']) || !uri.host || uri.host.startsWith('[') || uri.userInfo != null ||
            uri.rawQuery != null || uri.rawFragment != null || uri.normalize() != uri ||
            uri.port > 65535 || uri.rawAuthority != authority || uri.rawAuthority.contains('%') ||
            uri.path.contains('//') ||
            uri.path.contains('\\') || uri.path.tokenize('/').any { it in ['.', '..'] } ||
            value.any { Character.isISOControl((char) it) } ||
            uri.path.any { Character.isISOControl((char) it) }) {
            throw new GradleException('gradle-purifier: unsupported Javadoc link URL; use a credential-free HTTP(S) directory URL with a DNS name or IPv4 host (IPv6 is not supported)')
        }
        uri
    }

    static void validateRecords(List records) {
        def keys = new HashSet()
        def fields = ['kind', 'build', 'task', 'linkUrl', 'artifactUrl', 'hash'] as Set
        records.each { record ->
            if (!(record instanceof Map) || record.keySet() != fields ||
                !fields.every { record[it] instanceof String } || record.kind != 'javadoc-link-metadata' ||
                !(record.hash ==~ /sha256-[A-Za-z0-9+\/]{43}=/)) {
                throw new GradleException('gradle-purifier: invalid external resource role')
            }
            def build = record.build
            if (!(build == '.' || (!build.isEmpty() && !build.startsWith('/') && !build.contains('\\') &&
                build.split('/', -1).every { !(it in ['', '.', '..']) })) ||
                build.any { Character.isISOControl((char) it) } ||
                !record.task.startsWith(':') || record.task == ':' || record.task.endsWith(':') ||
                record.task.contains('::') || record.task.contains('/') || record.task.contains('\\') ||
                record.task.any { Character.isISOControl((char) it) }) {
                throw new GradleException('gradle-purifier: invalid external resource role context')
            }
            remote(record.linkUrl)
            remote(record.artifactUrl)
            def prefix = record.linkUrl.endsWith('/') ? record.linkUrl : record.linkUrl + '/'
            if (!(record.artifactUrl in [prefix + 'element-list', prefix + 'package-list'])) {
                throw new GradleException('gradle-purifier: Javadoc role does not name native link metadata')
            }
            def key = JsonOutput.toJson([record.build, record.task, record.linkUrl])
            if (!keys.add(key)) throw new GradleException('gradle-purifier: ambiguous Javadoc metadata roles')
        }
    }

    static String digest(byte[] bytes) {
        'sha256-' + java.util.Base64.encoder.encodeToString(
            java.security.MessageDigest.getInstance('SHA-256').digest(bytes))
    }

    static URI mapped(String base, URI uri) {
        if (uri.port == -1 && uri.rawAuthority?.contains(':')) {
            throw new GradleException('gradle-purifier: unsupported explicit-port repository URL')
        }
        def authority = uri.port == -1 ? uri.host : "${uri.host}:${uri.port}"
        URI.create("${base}/${uri.scheme.toLowerCase(Locale.ROOT)}/${authority}${uri.rawPath}")
    }

    static Map read(String mode, String base, String build, String task, String link,
                    List records, boolean refresh) {
        remote(link)
        def previous = records.findAll {
            it.kind == 'javadoc-link-metadata' && it.build == build && it.task == task && it.linkUrl == link
        }
        if (previous.size() > 1) throw new GradleException('gradle-purifier: ambiguous Javadoc metadata roles')
        def record = previous ? previous[0] : null
        if (mode != 'lock' && record == null) {
            throw new GradleException("gradle-purifier: Javadoc link metadata is not locked for ${task}; run 'gradle-purifier lock --relock'")
        }
        def nativeCandidates = ['element-list', 'package-list'].collect { (link.endsWith('/') ? link : link + '/') + it }
        def candidates = record != null && !refresh ? [record.artifactUrl] : nativeCandidates
        for (String candidate : candidates) {
            def original = remote(candidate)
            def filename = original.path.tokenize('/').last()
            if (!(filename in ['element-list', 'package-list']) || !(candidate in nativeCandidates)) {
                throw new GradleException('gradle-purifier: Javadoc role does not name native link metadata')
            }
            def location = mapped(base, original)
            byte[] bytes
            if (mode == 'lock') {
                def connection = location.toURL().openConnection()
                connection.setRequestProperty('X-Gradle-Purifier-Resource', 'javadoc-link-metadata')
                connection.connectTimeout = 30000
                connection.readTimeout = 30000
                try {
                    int status = connection.responseCode
                    if (status == 404 && (record == null || refresh)) continue
                    if (status != 200) throw new GradleException("gradle-purifier: Javadoc metadata fetch failed (${status})")
                    bytes = connection.inputStream.withCloseable { it.bytes }
                } finally {
                    connection.disconnect()
                }
            } else {
                if (location.scheme != 'file') throw new GradleException('gradle-purifier: Javadoc replay requires a local locked repository')
                def root = new File(URI.create(base)).canonicalFile.toPath()
                def file = new File(location).canonicalFile
                if (!file.toPath().startsWith(root) || !file.isFile()) {
                    throw new GradleException("gradle-purifier: locked Javadoc metadata is missing for ${task}; run 'gradle-purifier prefetch'")
                }
                bytes = file.bytes
            }
            // The inline lock representation is UTF-8 text. Reject bytes
            // that JSON encoding would otherwise replace during capture.
            java.nio.charset.StandardCharsets.UTF_8.newDecoder()
                .onMalformedInput(java.nio.charset.CodingErrorAction.REPORT)
                .decode(java.nio.ByteBuffer.wrap(bytes))
            def hash = digest(bytes)
            if (record != null && !refresh && record.hash != hash) {
                throw new GradleException("gradle-purifier: Javadoc metadata hash mismatch for ${task}")
            }
            return [record: [kind: 'javadoc-link-metadata', build: build, task: task,
                              linkUrl: link, artifactUrl: candidate, hash: hash],
                    filename: filename, bytes: bytes]
        }
        throw new GradleException("gradle-purifier: no element-list or package-list for Javadoc task ${task}")
    }
}

def resourceManifest = setting('GRADLE_PURIFIER_RESOURCES')
def resourceRecords = []
if (resourceManifest && new File(resourceManifest).isFile()) {
    def document = new JsonSlurper().parse(new File(resourceManifest))
    if (!(document instanceof List) && !(document instanceof Map)) {
        throw new GradleException('gradle-purifier: invalid external resource manifest')
    }
    resourceRecords = document instanceof List ? document : (document.resources ?: [])
    if (!(resourceRecords instanceof List)) throw new GradleException('gradle-purifier: invalid external resource manifest')
}
PurifierJavadocMetadata.validateRecords(resourceRecords)
def refreshResources = System.getenv('GRADLE_PURIFIER_RESOURCE_REFRESH') == '1'
if (mode != 'publish') {
    gradle.projectsEvaluated { g ->
        def outermost = g
        while (outermost.parent != null) outermost = outermost.parent
        g.rootProject.allprojects.each { project ->
            def context = outermost.rootProject.projectDir.toPath().relativize(project.rootDir.toPath()).toString().replace('\\', '/') ?: '.'
            project.tasks.withType(org.gradle.api.tasks.javadoc.Javadoc).toList().each { javadoc ->
                if (!(javadoc.options instanceof org.gradle.external.javadoc.StandardJavadocDocletOptions)) return
                def remoteLinks = { javadoc.options.links.findAll { URI.create(it).scheme?.toLowerCase(Locale.ROOT) in ['http', 'https'] }.toList() }
                if (remoteLinks().isEmpty()) return
                if (javadoc.options.doclet != null) {
                    throw new GradleException('gradle-purifier: external Javadoc capture supports the standard doclet only')
                }
                def destination = project.layout.buildDirectory.dir("purifier-javadoc/${javadoc.name}")
                def selectedRoles = resourceRecords.findAll { it.build == context && it.task == javadoc.path }
                def prepare = project.tasks.register("purifier${javadoc.name.capitalize()}LinkMetadata") { task ->
                    task.inputs.property('linkUrls', project.provider(remoteLinks))
                    task.inputs.property('metadataMode', mode)
                    task.inputs.property('metadataRepository', base)
                    task.inputs.property('metadataRoles', JsonOutput.toJson(selectedRoles))
                    if (mode != 'lock') {
                        task.inputs.files(project.provider {
                            selectedRoles.collect { role ->
                                new File(PurifierJavadocMetadata.mapped(base,
                                    PurifierJavadocMetadata.remote(role.artifactUrl)))
                            }
                        }).withPropertyName('lockedJavadocMetadata')
                    }
                    task.outputs.dir(destination)
                    task.doLast {
                        def directory = destination.get().asFile
                        project.delete(directory)
                        directory.mkdirs()
                        def captured = remoteLinks().withIndex().collect { link, index ->
                            def selected = PurifierJavadocMetadata.read(mode, base, context, javadoc.path,
                                link, resourceRecords, refreshResources)
                            def metadata = new File(directory, index.toString())
                            metadata.mkdirs()
                            new File(metadata, selected.filename).bytes = selected.bytes
                            selected.record
                        }
                        PurifierJavadocMetadata.validateRecords(captured)
                        new File(directory, 'roles.json').text = JsonOutput.toJson(captured)
                        if (mode == 'lock') {
                            def key = java.security.MessageDigest.getInstance('SHA-256')
                                .digest((context + ':' + javadoc.path).getBytes('UTF-8')).encodeHex().toString()
                            def file = new File(output, "external-resources/${key}.json")
                            file.parentFile.mkdirs()
                            file.text = JsonOutput.toJson(captured)
                        }
                    }
                }
                javadoc.dependsOn(prepare)
                javadoc.inputs.dir(destination).withPropertyName('purifierJavadocLinkMetadata')
                javadoc.doFirst {
                    def directory = destination.get().asFile
                    def captured = new JsonSlurper().parse(new File(directory, 'roles.json'))
                    if (captured.collect { it.linkUrl } != remoteLinks()) {
                        throw new GradleException('gradle-purifier: Javadoc links changed after their metadata was prepared')
                    }
                    javadoc.options.links = javadoc.options.links.findAll { !(it in captured.collect { r -> r.linkUrl }) }
                    captured.eachWithIndex { record, index ->
                        javadoc.options.linksOffline(record.linkUrl, new File(directory, index.toString()).absolutePath)
                    }
                }
            }
        }
    }
}

// The Nix input catalog is outside the native repository and is not a
// downloaded dependency. It supplies the selected versions automatically.
def providedCatalog = setting('GRADLE_PURIFIER_PROVIDED_CATALOG')
def providedRepository = setting('GRADLE_PURIFIER_PROVIDED_REPOSITORY')
def provided = [:]
if (providedCatalog) {
    def catalog = new JsonSlurper().parse(new File(providedCatalog))
    if (catalog.version != 1 || !providedRepository) {
        throw new GradleException('gradle-purifier: invalid Nix dependency projection')
    }
    catalog.modules.each { module ->
        provided["${module.group}:${module.name}".toString()] = module.version
    }
}
def addProvidedRepository = { repositories ->
    if (!provided.isEmpty()) {
        repositories.maven {
            name = 'purifierNixInputs'
            url = new File(providedRepository).toURI()
            content { descriptor ->
                provided.keySet().each { coordinate ->
                    def parts = coordinate.split(':', 2)
                    descriptor.includeModule(parts[0], parts[1])
                }
            }
        }
        // Use matching exclusions rather than exclusiveContent: Gradle
        // forbids buildscript repositories when pluginManagement is exclusive.
        repositories.all { repository ->
            if (repository.name != 'purifierNixInputs') {
                repository.content { descriptor ->
                    provided.keySet().each { coordinate ->
                        def parts = coordinate.split(':', 2)
                        descriptor.excludeModule(parts[0], parts[1])
                    }
                }
            }
        }
    }
}
def selectProvided = { configurations ->
    configurations.configureEach { configuration ->
        configuration.resolutionStrategy.dependencySubstitution.all { substitution ->
            def requested = substitution.requested
            if (requested instanceof ModuleComponentSelector) {
                def version = provided["${requested.group}:${requested.module}".toString()]
                if (version) {
                    substitution.useTarget("${requested.group}:${requested.module}:${version}".toString(),
                        'selected by a Nix dependency')
                }
            }
        }
    }
}

// The stand-in URL of a remote URL. A URL that is not http or https, or
// that already points at the stand-in (the plugin portal, which the
// command line overrides), stays as it is, and the result is null.
class PurifierRepositoryReplay {
    static URI mapped(String base, URI uri) {
        if (uri.port == -1 && uri.rawAuthority?.contains(':')) {
            throw new GradleException('gradle-purifier: unsupported explicit-port repository URL')
        }
        def authority = uri.port == -1 ? uri.host : "${uri.host}:${uri.port}"
        if (uri.port != -1) {
            if (!uri.host || uri.host.startsWith('[') || uri.userInfo != null || uri.rawAuthority != authority || uri.rawAuthority.contains('%') ||
                uri.rawQuery != null || uri.rawFragment != null || uri.port > 65535 || uri.normalize() != uri ||
                uri.path.contains('\\') || uri.path.tokenize('/').any { it in ['.', '..'] } ||
                uri.path.any { Character.isISOControl((char) it) }) {
                throw new GradleException('gradle-purifier: unsupported explicit-port repository URL')
            }
            if (URI.create(base).scheme == 'file') {
                def encoded = uri.rawAuthority.getBytes('UTF-8').encodeHex().toString()
                return URI.create("${base}/.gradle-purifier-replay-v1/${uri.scheme}/${encoded}${uri.rawPath ?: ''}")
            }
        }
        URI.create("${base}/${uri.scheme}/${authority}${uri.rawPath ?: ''}")
    }
}

def standIn = { URI uri ->
    if (uri == null || !(uri.scheme in ['http', 'https']) || uri.toString().startsWith(base)) {
        return null
    }
    return PurifierRepositoryReplay.mapped(base, uri)
}

def purify = { repository ->
    if (legacy56 ? (repository instanceof MavenArtifactRepository || repository instanceof IvyArtifactRepository) : urlRepositoryType.isInstance(repository)) {
        def replaced = standIn(repository.url)
        if (replaced != null) {
            repository.url = replaced
            // The recorder serves plain HTTP on the loopback address.
            if (replaced.scheme == 'http' && !legacy56) {
                repository.allowInsecureProtocol = true
            }
        }
    }
    if (repository instanceof MavenArtifactRepository && !repository.artifactUrls.isEmpty()) {
        repository.artifactUrls = repository.artifactUrls.collect { standIn(it) ?: it } as Set
    }
}

// The release executables Kotlin/Native links for a project, each with its
// base name and its binary.
def nativeExecutables = { project ->
    def kotlin = project.extensions.findByName('kotlin')
    if (kotlin == null || !kotlin.hasProperty('targets')) {
        return []
    }
    def executables = []
    kotlin.targets.each { target ->
        if (!target.hasProperty('binaries')) {
            return
        }
        target.binaries.each { binary ->
            if (binary.class.name.startsWith('org.jetbrains.kotlin.gradle.plugin.mpp.Executable') &&
                binary.buildType.name() == 'RELEASE') {
                executables << [name: binary.baseName, binary: binary]
            }
        }
    }
    executables.sort { it.name }
}

// The archives a project's `assemble` makes (jar, sources jar, Spring
// Boot's bootJar, a shadow jar, distZip and so on), each with a key: its
// file name without the project's version.
def assembleArchives = { project ->
    def assemble = project.tasks.findByName('assemble')
    if (assemble == null) {
        return []
    }
    assemble.taskDependencies.getDependencies(assemble)
        .findAll { it instanceof org.gradle.api.tasks.bundling.AbstractArchiveTask && it.enabled }
        .collect { task ->
            def parts = [task.archiveBaseName.getOrNull(), task.archiveAppendix.getOrNull(), task.archiveClassifier.getOrNull()]
                .findAll { it }
            [key: "${parts.join('-')}.${task.archiveExtension.get()}".toString(), task: task]
        }
        .sort { it.key }
}

// The name of a project in the lockfile and in the Nix builder: the root
// project's name for the root project, and its path with ":" as "-"
// otherwise.
def idOf = { project ->
    project.path == ':' ? project.rootProject.name : project.path.substring(1).replace(':', '-')
}

def failOnProjectRepositories = false
if (legacy56) {
    // This is later than beforeSettings: settings code needing remote resolution
    // was rejected by the declarative settings validator above.
    settingsEvaluated { settings ->
        addProvidedRepository(settings.pluginManagement.repositories)
        addProvidedRepository(settings.buildscript.repositories)
        settings.pluginManagement.repositories.all(purify)
        settings.buildscript.repositories.all(purify)
    }
} else {
    settingsEvaluated { settings ->
        failOnProjectRepositories = settings.dependencyResolutionManagement.repositoriesMode.get().name() == 'FAIL_ON_PROJECT_REPOS'
    }
    beforeSettings { settings ->
        addProvidedRepository(settings.pluginManagement.repositories)
        addProvidedRepository(settings.buildscript.repositories)
        addProvidedRepository(settings.dependencyResolutionManagement.repositories)
        settings.pluginManagement.repositories.all(purify)
        settings.buildscript.repositories.all(purify)
        settings.dependencyResolutionManagement.repositories.all(purify)
    }
}

allprojects { project ->
    if (legacy56) project.plugins.withId('maven-publish') {
        throw new GradleException('gradle-purifier: Gradle5.6.4 maven-publish metadata is unsupported; this profile supports basic legacy maven Upload only')
    }
    if (!provided.isEmpty()) {
        addProvidedRepository(project.buildscript.repositories)
        if (!failOnProjectRepositories) {
            addProvidedRepository(project.repositories)
        }
        selectProvided(project.configurations)
        selectProvided(project.buildscript.configurations)
        project.plugins.withId('maven-publish') {
            project.publishing.publications.withType(MavenPublication).configureEach { publication ->
                if (internalLegacyPublication(project, publication)) return
                publication.versionMapping { allVariants { fromResolutionResult() } }
            }
        }
    }
    project.buildscript.repositories.all(purify)
    project.repositories.all(purify)

    if (rootBuild && mode in ['lock', 'sandbox', 'publish']) {
        project.pluginManager.withPlugin('maven') {
            def legacyBindings = new JsonSlurper().parseText(System.getenv('GRADLE_PURIFIER_LEGACY_PUBLICATIONS') ?: '[]')
            if (!(legacyBindings instanceof List) || !legacyBindings.every { binding ->
                binding instanceof Map && binding.keySet() == (['path', 'publication'] as Set) &&
                    binding.path instanceof String && binding.publication instanceof Map && binding.publication.kind == 'legacy-maven-upload'
            }) throw new GradleException('gradle-purifier: invalid legacy publication bindings; run gradle-purifier lock --relock')
            // Old locks recorded archives but no legacy Maven publication.
            // Their sandbox build must not invent or require a new binding.
            if (mode == 'sandbox' && !legacyBindings.any { it.path == project.path }) return
            if (!gradle.ext.has('purifierLegacyMaven')) {
                gradle.ext.purifierLegacyMaven = [mode: mode, output: output,
                    bindings: legacyBindings,
                    captureMetadata: !legacy56 && System.getenv('GRADLE_PURIFIER_LEGACY_METADATA_CAPTURE') == '1',
                    repository: setting('GRADLE_PURIFIER_PUBLICATION_REPOSITORY'), catalog: setting('GRADLE_PURIFIER_PUBLICATION_CATALOG'),
                    artifacts: new JsonSlurper().parseText(System.getenv('GRADLE_PURIFIER_ARTIFACTS') ?: '{}')]
                apply from: new File(purifierScriptDirectory, 'legacy-maven.init.gradle')
            }
            gradle.ext.purifierLegacyMaven.register(project)
        }
    }

    if (konanDataDir) {
        project.extensions.extraProperties.set('konan.data.dir', konanDataDir)
    }

    // Every Kotlin/Native binary, test binaries included, links with the
    // konan.properties overrides.
    if (konanProperties) {
        project.afterEvaluate {
            def kotlin = project.extensions.findByName('kotlin')
            if (kotlin != null && kotlin.hasProperty('targets')) {
                kotlin.targets.all { target ->
                    if (target.hasProperty('binaries')) {
                        target.binaries.all { binary ->
                            binary.freeCompilerArgs += ["-Xoverride-konan-properties=${konanProperties}".toString()]
                        }
                    }
                }
            }
        }
    }

    if (!rootBuild || mode == 'interactive' || mode == 'publish') {
        return
    }

    def outputDir = new File(output, idOf(project))

    // Every publication publishes into the output as well, through the
    // `purifier` repository; the Nix build copies it from there.
    project.pluginManager.withPlugin('maven-publish') {
        project.publishing.repositories.maven { repository ->
            repository.name = 'purifier'
            repository.url = new File(outputDir, 'maven').toURI()
        }
    }

    // What a sandboxed package build of this project runs: the publishing
    // of its publications, the installation of its application, and, with
    // GRADLE_PURIFIER_CHECK=1, its checks.
    project.tasks.register('purifierBuild') { task ->
        task.group = 'gradle-purifier'
        task.description = 'Builds what the Nix package of this project holds.'
        task.dependsOn { project.configurations.findAll { PurifierRuntime.runtime(it) } }
        task.doLast { PurifierRuntime.export(project, new File(outputDir, 'runtime-data.json')) }
        task.dependsOn(project.tasks.matching { t ->
            t.name in ['publishAllPublicationsToPurifierRepository', 'purifierInstall', 'purifierNativeInstall', 'purifierArchives', 'purifierLegacySnapshot', 'purifierLegacyMetadataSnapshot'] ||
                (runCheck && t.name == 'check')
        })

    }
    // The archives of `assemble` go to archives/, under their keys. The
    // Kotlin Multiplatform plugin adds archive tasks to `assemble` after
    // the init script's afterEvaluate, so the archives are read once every
    // project is evaluated, when the lock run describes them too.
    gradle.projectsEvaluated {
        def archives = assembleArchives(project)
        if (!archives.isEmpty()) {
            project.tasks.register('purifierArchives', Sync) { task ->
                archives.each { a ->
                    task.from(a.task) {
                        it.rename { a.key }
                    }
                }
                task.into(new File(outputDir, 'archives'))
            }
        }
    }
    // Kotlin/Native's release executables go to bin/, without the .kexe
    // of their file names.
    project.afterEvaluate {
        def executables = nativeExecutables(project)
        if (!executables.isEmpty()) {
            project.tasks.register('purifierNativeInstall', Sync) { task ->
                executables.each { e ->
                    task.from(e.binary.linkTaskProvider) {
                        it.include "${e.name}.kexe"
                        it.rename { e.name }
                    }
                }
                task.into(new File(outputDir, 'bin'))
            }
        }
    }
    project.pluginManager.withPlugin('application') {
        project.tasks.register('purifierInstall', Sync) { task ->
            task.from(project.tasks.named('installDist'))
            task.into(new File(outputDir, 'application'))
        }
    }

    if (mode != 'lock') {
        return
    }

    // Resolves every resolvable configuration of the project, the
    // buildscript's too, so the lock holds what a task the lock run does
    // not run would resolve. Resolution is lenient: a configuration that
    // does not resolve on its own takes no part.
    //
    // An IDE that imports the build also asks for the sources and the
    // javadoc of every library, which no task resolves, so it resolves
    // those too.
    def configurations = project.configurations
    def scriptConfigurations = project.buildscript.configurations
    def dependencyHandler = project.dependencies
    project.tasks.register('purifierResolveAll') { task ->
        task.doLast {
            def components = [] as Set
            (scriptConfigurations + configurations).findAll { it.canBeResolved }.each { configuration ->
                try {
                    configuration.incoming.artifactView { it.lenient(true) }.files.files
                    configuration.incoming.resolutionResult.allComponents.each { c ->
                        if (c.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                            components << c.id
                        }
                    }
                } catch (Exception e) {
                    task.logger.info("gradle-purifier: ${configuration.name} did not resolve: ${e.message}")
                }
            }
            if (!components.isEmpty()) {
                try {
                    dependencyHandler.createArtifactResolutionQuery()
                        .forComponents(components)
                        .withArtifacts(org.gradle.jvm.JvmLibrary,
                            org.gradle.language.base.artifact.SourcesArtifact,
                            org.gradle.language.java.artifact.JavadocArtifact)
                        .execute()
                        .resolvedComponents.each { c ->
                            c.getArtifacts(org.gradle.language.base.artifact.SourcesArtifact).each { a ->
                                if (a instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult) a.file
                            }
                            c.getArtifacts(org.gradle.language.java.artifact.JavadocArtifact).each { a ->
                                if (a instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult) a.file
                            }
                        }
                } catch (Exception e) {
                    task.logger.info("gradle-purifier: sources and javadoc did not resolve: ${e.message}")
                }
            }
        }
    }

    // The lock run: everything a package build with checks runs, for
    // every project, so its downloads hold what any package build needs.
    if (project == project.rootProject) {
        project.tasks.register('purifierLock') { task ->
            task.group = 'gradle-purifier'
            task.description = 'Runs every package build with its checks, for the lockfile.'
            task.dependsOn {
                project.rootProject.allprojects.collect { p ->
                    p.tasks.matching { t ->
                        t.name in ['build', 'purifierBuild', 'purifierResolveAll']
                    }
                }
            }
        }
    }
}

// Publish mode: every Maven publication of the root build publishes the
// files its Nix package holds, in place of the ones the build would make.
// The publications then depend on no task that compiles or packages, so
// the build's own publish tasks send what Nix built, with the repositories
// and credentials the build configures. A publication's Gradle module
// metadata is the one Nix built too.
if (rootBuild && mode == 'publish') {
    def built = new JsonSlurper().parseText(System.getenv('GRADLE_PURIFIER_ARTIFACTS') ?: '{}')
    def repositoryPath = setting('GRADLE_PURIFIER_PUBLICATION_REPOSITORY')
    def catalogPath = setting('GRADLE_PURIFIER_PUBLICATION_CATALOG')
    if (!repositoryPath || !catalogPath) {
        throw new GradleException('gradle-purifier: publishing needs the Nix publication repository and catalog')
    }
    def catalog = new JsonSlurper().parse(new File(catalogPath))
    def modules = catalog.modules.collectEntries { module ->
        [("${module.group}:${module.name}".toString()): module]
    }
    def configurePublication = { project, publication, module, originals ->
        publication.groupId = module.group
        publication.artifactId = module.name
        publication.version = module.version
        def directory = new File(repositoryPath,
            "${module.group.replace('.', '/')}/${module.name}/${module.version}".toString())
        def prefix = "${module.name}-${module.version}".toString()
        def files = originals == null ? directory.listFiles().findAll { file ->
            file.isFile() && file.name.startsWith(prefix) &&
                !(file.name == prefix + '.pom') &&
                !(file.name ==~ /.*\.(md5|sha1|sha256|sha512|asc)$/)
        }.collect { file ->
            def suffix = file.name.substring(prefix.length())
            def parts = suffix.startsWith('.') ? [null, suffix.substring(1)] : suffix.substring(1).split(/\./, 2)
            [file: file, classifier: parts[0], extension: parts[1]]
        } : originals.collect { artifact ->
            def classifier = artifact.classifier ?: null
            def suffix = (classifier ? '-' + classifier : '') + '.' + artifact.extension
            def file = new File(directory, prefix + suffix)
            if (!file.isFile()) {
                throw new GradleException("gradle-purifier: the Nix projection has no ${file.name}")
            }
            [file: file, classifier: classifier, extension: artifact.extension]
        }
        publication.artifacts = []
        files.each { replacement ->
            publication.artifact(replacement.file) { artifact ->
                artifact.classifier = replacement.classifier
                artifact.extension = replacement.extension
            }
        }
        def moduleFile = new File(directory, prefix + '.module')
        if (originals != null && moduleFile.isFile()) {
            publication.artifact(moduleFile) { artifact -> artifact.extension = 'module' }
        }
        project.tasks.withType(GenerateMavenPom).matching {
            it.name == "generatePomFileFor${publication.name.capitalize()}Publication".toString()
        }.configureEach { task ->
            task.destination = new File(directory, prefix + '.pom')
            task.enabled = false
        }
        project.tasks.withType(GenerateModuleMetadata).matching {
            it.name == "generateMetadataFileFor${publication.name.capitalize()}Publication".toString()
        }.configureEach { task -> task.enabled = false }
    }
    gradle.projectsEvaluated { g ->
        def owners = []
        def owned = [] as Set
        g.rootProject.allprojects.each { project ->
            def publishing = project.extensions.findByName('publishing')
            if (publishing == null) return
            publishing.publications.withType(MavenPublication).each { publication ->
                if (internalLegacyPublication(project, publication)) return
                def coordinate = "${publication.groupId}:${publication.artifactId}".toString()
                def module = modules[coordinate]
                if (built[idOf(project)] == null || module == null) {
                    throw new GradleException("gradle-purifier: no Nix publication of ${project.path}/${publication.name}; run gradle-purifier lock")
                }
                owned.add("${module.group}:${module.name}:${module.version}".toString())
                configurePublication(project, publication, module, publication.artifacts.toList())
                owners.add(project)
            }
        }
        def extraModules = (catalog.publications ?: catalog.modules).findAll { module ->
            !owned.contains("${module.group}:${module.name}:${module.version}".toString())
        }
        if (!extraModules.isEmpty() && !owners.isEmpty()) {
            def host = owners[0]
            def publishing = host.extensions.getByName('publishing')
            def extras = []
            extraModules.eachWithIndex { module, index ->
                def name = "purifierNixInput${index}".toString()
                while (publishing.publications.findByName(name) != null) name += '_'
                def publication = publishing.publications.create(name, MavenPublication)
                configurePublication(host, publication, module, null)
                extras.add(publication)
            }
            // Use each original target's repository object, retaining its
            // credentials and transport settings. One upload per URL supplies
            // the input closure even for an explicitly named publish task.
            def extraNames = extras.collect { it.name } as Set
            host.tasks.withType(PublishToMavenRepository).configureEach { task ->
                if (extraNames.any { name -> task.name.startsWith("publish${name.capitalize()}PublicationTo".toString()) }) {
                    task.enabled = false
                }
            }
            def targets = owners.unique().collectMany { project ->
                project.tasks.withType(PublishToMavenRepository).findAll { task ->
                    task.publication != null && !extraNames.contains(task.publication.name)
                }
            }
            def deployments = [:]
            targets.each { target ->
                def key = target.repository.url.toString().replaceAll('/+$', '')
                if (!deployments.containsKey(key)) {
                    def repository = target.repository
                    def repositoryIndex = deployments.size()
                    deployments[key] = extras.withIndex().collect { publication, index ->
                        host.tasks.register("purifierDeployInput${index}ToRepository${repositoryIndex}".toString(),
                            PublishToMavenRepository) { task ->
                            task.publication = publication
                            task.repository = repository
                        }
                    }
                }
                target.dependsOn(deployments[key])
            }
        }
    }
}

// The projects of the lock: every project of the root build with a Maven
// publication or an application, and what each publishes. The lock run
// writes them to projects.json in the output, for the command to put in
// the lockfile.
if (rootBuild && mode == 'lock') {
    gradle.projectsEvaluated { g ->
        def projects = g.rootProject.allprojects.collect { project ->
            def publications = []
            def legacyPublications = gradle.ext.has('purifierLegacyMaven') ?
                gradle.ext.purifierLegacyMaven.describe(project) : []
            def publishing = project.extensions.findByName('publishing')
            if (publishing != null) {
                publishing.publications.withType(MavenPublication).each { publication ->
                    if (internalLegacyPublication(project, publication)) return
                    publications << [
                        name      : publication.name,
                        groupId   : publication.groupId,
                        artifactId: publication.artifactId,
                        artifacts : publication.artifacts.collect { a ->
                            [
                                classifier: a.classifier ?: null,
                                extension : a.extension,
                            ]
                        }.sort { "${it.classifier ?: ''}.${it.extension}".toString() },
                    ]
                }
            }
            publications.addAll(legacyPublications)
            def application = project.extensions.findByName('application')
            [
                path        : project.path,
                publications: publications.sort { it.name },
                application : application == null ? null : [name: application.applicationName],
                executables : nativeExecutables(project).collect { it.name },
                archives    : assembleArchives(project).collect { it.key },
            ]
        }.findAll {
            !it.publications.isEmpty() || it.application != null || !it.executables.isEmpty() || !it.archives.isEmpty()
        }
        def file = new File(output, 'projects.json')
        file.parentFile.mkdirs()
        file.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            javaMajor      : Runtime.version().feature(),
            rootProjectName: g.rootProject.name,
            projects       : projects.sort { it.path },
        ]))
    }
}

// Ask Gradle for the graph it actually selected, including substituted
// projects. Tool and buildscript configurations are deliberately outside it.
class PurifierRuntime {
    static boolean runtime(configuration) {
        configuration.canBeResolved && configuration.name.toLowerCase().endsWith('runtimeclasspath') &&
            !configuration.name.startsWith('test') && !configuration.name.contains('Test')
    }

    static Map coordinate(component) {
        def id = component.moduleVersion
        if (id == null) return null
        [group: id.group, name: id.name, version: id.version]
    }

    static void export(project, File destination) {
        def components = [:]
        def files = [:].withDefault { [] }
        project.configurations.findAll { runtime(it) }.each { configuration ->
            configuration.incoming.resolutionResult.allComponents.each { component ->
                def module = coordinate(component)
                if (module != null) {
                    def key = "${module.group}:${module.name}".toString()
                    if (components[key] != null && coordinate(components[key]).version != module.version) {
                        throw new GradleException("gradle-purifier: multiple runtime versions of ${key}")
                    }
                    components[key] = component
                }
            }
            configuration.incoming.artifacts.artifacts.each { artifact ->
                files[artifact.id.componentIdentifier].add(artifact.file)
            }
        }
        def poms = [:]
        def visiting = [] as Set
        def text = { node, String name ->
            def children = node.childNodes
            (0..<children.length).collect { children.item(it) }.find {
                it.nodeType == org.w3c.dom.Node.ELEMENT_NODE && (it.localName ?: it.nodeName) == name
            }?.textContent?.trim() ?: ''
        }
        def element = { node, String name ->
            def children = node.childNodes
            (0..<children.length).collect { children.item(it) }.find {
                it.nodeType == org.w3c.dom.Node.ELEMENT_NODE && (it.localName ?: it.nodeName) == name
            }
        }
        def expand = { String value, Map properties ->
            32.times { properties.each { key, replacement -> value = value.replace('${' + key + '}', replacement) } }
            value
        }
        Closure readPom
        readPom = { Map module ->
            def key = "${module.group}:${module.name}:${module.version}".toString()
            if (poms.containsKey(key)) return poms[key].properties
            if (!visiting.add(key)) throw new GradleException("gradle-purifier: cyclic POM parents at ${key}")
            def query = project.dependencies.createArtifactResolutionQuery()
                .forModule(module.group, module.name, module.version)
                .withArtifacts(org.gradle.maven.MavenModule, org.gradle.maven.MavenPomArtifact)
                .execute()
            def artifact = query.resolvedComponents.collectMany {
                it.getArtifacts(org.gradle.maven.MavenPomArtifact).findAll {
                    it instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult
                }
            }.find()
            if (artifact == null) {
                visiting.remove(key)
                return [:]
            }
            def parser = javax.xml.parsers.DocumentBuilderFactory.newInstance()
            parser.namespaceAware = true
            parser.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
            def root = parser.newDocumentBuilder().parse(artifact.file).documentElement
            def properties = [:]
            def local = element(root, 'properties')
            if (local != null) {
                (0..<local.childNodes.length).each { index ->
                    def node = local.childNodes.item(index)
                    if (node.nodeType == org.w3c.dom.Node.ELEMENT_NODE) {
                        properties[node.localName ?: node.nodeName] = node.textContent.trim()
                    }
                }
            }
            def parent = element(root, 'parent')
            if (parent != null) {
                def selected = [group: expand(text(parent, 'groupId'), properties),
                    name: expand(text(parent, 'artifactId'), properties),
                    version: expand(text(parent, 'version'), properties)]
                def inherited = readPom(selected)
                properties = inherited + properties
                properties['project.parent.groupId'] = selected.group
                properties['project.parent.version'] = selected.version
            }
            properties['project.groupId'] = module.group
            properties['pom.groupId'] = module.group
            properties['project.version'] = module.version
            properties['pom.version'] = module.version
            poms[key] = module + [file: artifact.file.absolutePath, properties: properties]
            visiting.remove(key)
            def management = element(root, 'dependencyManagement')
            def dependencies = management == null ? null : element(management, 'dependencies')
            if (dependencies != null) {
                (0..<dependencies.childNodes.length).each { index ->
                    def node = dependencies.childNodes.item(index)
                    if (node.nodeType == org.w3c.dom.Node.ELEMENT_NODE && text(node, 'scope') == 'import') {
                        readPom([group: expand(text(node, 'groupId'), properties),
                            name: expand(text(node, 'artifactId'), properties),
                            version: expand(text(node, 'version'), properties)])
                    }
                }
            }
            properties
        }
        def modules = []
        components.values().each { component ->
            def module = coordinate(component)
            def artifacts = files[component.id].findAll { it.isFile() }.unique()
            def local = component.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier
            if (local && artifacts.isEmpty()) return
            if (!local) readPom(module)
            def dependencies = component.dependencies.findAll {
                it instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult
            }.collect { coordinate(it.selected) }.findAll { it != null }.unique()
            modules << module + [project: local, files: artifacts.collect { it.absolutePath }, dependencies: dependencies]
        }
        destination.parentFile.mkdirs()
        destination.text = JsonOutput.toJson([modules: modules,
            poms: poms.values().collect { it.findAll { key, value -> key != 'properties' } }]) + '\n'
    }
}
